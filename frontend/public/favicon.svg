<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Red background -->
  <rect width="100" height="100" fill="#dc2626" rx="12"/>
  
  <!-- Ambulance body -->
  <rect x="15" y="40" width="70" height="35" fill="white" rx="3"/>
  
  <!-- Ambulance roof -->
  <polygon points="15,40 35,25 55,25 85,40" fill="white"/>
  
  <!-- Red cross on side -->
  <rect x="50" y="50" width="8" height="20" fill="#dc2626"/>
  <rect x="43" y="57" width="22" height="8" fill="#dc2626"/>
  
  <!-- Window -->
  <rect x="20" y="30" width="18" height="12" fill="#1e40af" rx="2"/>
  
  <!-- Wheels -->
  <circle cx="30" cy="80" r="8" fill="#1f2937"/>
  <circle cx="30" cy="80" r="5" fill="#4b5563"/>
  <circle cx="70" cy="80" r="8" fill="#1f2937"/>
  <circle cx="70" cy="80" r="5" fill="#4b5563"/>
  
  <!-- Light bar -->
  <rect x="25" y="20" width="50" height="8" fill="#fbbf24" rx="2"/>
  <circle cx="35" cy="24" r="2" fill="#dc2626"/>
  <circle cx="65" cy="24" r="2" fill="#3b82f6"/>
</svg>
